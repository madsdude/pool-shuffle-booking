<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pool & Shuffle Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#0f172a; } /* slate-900 */
  </style>
</head>
<body class="text-slate-900">
  <div class="max-w-5xl mx-auto p-4">
    <!-- Header -->
    <header class="mb-6">
      <h1 class="text-3xl font-bold text-white">Book bord</h1>
      <p class="text-white/80 mt-1">Vælg bord, dato og tidspunkt – og få bekræftelse på e-mail.</p>
    </header>

    <!-- Booking-kort -->
    <div class="bg-white/95 rounded-2xl shadow p-6">
      <div class="grid md:grid-cols-2 gap-4">
        <!-- Bord -->
        <div class="flex-1">
          <label for="resource" class="block text-sm font-medium text-gray-700">Bord</label>
          <select id="resource" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
            <!-- udfyldes af JS -->
          </select>
        </div>

        <!-- Dato -->
        <div class="flex-1">
          <label for="date" class="block text-sm font-medium text-gray-700">Dato</label>
          <input id="date" type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"/>
        </div>

        <!-- Start -->
        <div class="flex-1">
          <label for="start" class="block text-sm font-medium text-gray-700">Start</label>
          <input id="start" type="time" step="60" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"/>
        </div>

        <!-- Varighed -->
        <div class="flex-1">
          <label for="duration" class="block text-sm font-medium text-gray-700">Varighed</label>
          <select id="duration" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
            <option value="60">1 time</option>
            <option value="90">1½ time</option>
            <option value="120">2 timer</option>
            <option value="150">2½ time</option>
            <option value="180">3 timer</option>
          </select>
        </div>

        <!-- Slut (auto) -->
        <div class="flex-1">
          <label for="end" class="block text-sm font-medium text-gray-700">Slut (auto)</label>
          <input id="end" type="time" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" disabled/>
        </div>

        <!-- Navn -->
        <div class="flex-1">
          <label for="name" class="block text-sm font-medium text-gray-700">Navn</label>
          <input id="name" type="text" placeholder="Fornavn Efternavn" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"/>
        </div>

        <!-- Telefon (valgfri) -->
        <div class="flex-1">
          <label for="phone" class="block text-sm font-medium text-gray-700">Telefon (valgfri)</label>
          <input id="phone" type="tel" placeholder="fx 12 34 56 78" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"/>
        </div>

        <!-- Email (påkrævet) -->
        <div class="flex-1">
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input id="email" type="email" required placeholder="fx navn@domæne.dk" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"/>
        </div>
      </div>

      <div class="mt-5 flex items-center gap-3">
        <button id="check" class="px-4 py-2 rounded bg-indigo-600 text-white hover:bg-indigo-700">Tjek & book</button>
        <span id="status" class="text-sm text-gray-600"></span>
      </div>
    </div>

    <!-- Liste: dagens bookinger -->
    <section class="mt-10">
      <h2 class="text-xl font-semibold mb-3 text-white">Bookinger for valgt bord og dato</h2>
      <div id="list" class="bg-white/95 rounded-2xl shadow p-4 text-sm text-gray-800">
        <div class="text-gray-500">Ingen bookinger endnu.</div>
      </div>
    </section>
  </div>

  <script>
    // Helpers
    const $ = (id) => document.getElementById(id);

    const selRes = $('resource');
    const inpDate = $('date');
    const inpStart = $('start');
    const selDur = $('duration');
    const inpEnd = $('end');
    const inpName = $('name');
    const inpPhone = $('phone');
    const inpEmail = $('email');
    const btnCheck = $('check');
    const statusEl = $('status');
    const listEl = $('list');

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${dd}`;
    }
    inpDate.value = todayStr();

    function pad2(n){ return String(n).padStart(2,'0'); }
    function addMinutes(hhmm, add) {
      const [h, m] = hhmm.split(':').map(x=>parseInt(x,10));
      const t = new Date(2000,0,1,h,m,0,0);
      t.setMinutes(t.getMinutes() + add);
      return `${pad2(t.getHours())}:${pad2(t.getMinutes())}`;
    }
    function toISODate(s) {
      if (/^\d{2}-\d{2}-\d{4}$/.test(s)) {
        const [dd, mm, yyyy] = s.split("-");
        return `${yyyy}-${mm}-${dd}`;
      }
      return s;
    }

    // Opdater slut-tid når start/varighed ændres
    function updateEnd() {
      const start = (inpStart.value || '').trim();
      const dur = parseInt(selDur.value || '60', 10);
      if (/^\d{2}:\d{2}$/.test(start)) {
        inpEnd.value = addMinutes(start, dur);
      } else {
        inpEnd.value = '';
      }
    }
    inpStart.addEventListener('change', updateEnd);
    selDur.addEventListener('change', updateEnd);

    // Load ressourcer og prefill
    async function loadResources() {
      selRes.innerHTML = '';
      const r = await fetch('/api/resources');
      if (!r.ok) {
        selRes.innerHTML = '<option value="">(fejl ved hentning)</option>';
        return;
      }
      const resources = await r.json();
      for (const res of resources) {
        const opt = document.createElement('option');
        opt.value = res.id;
        opt.textContent = res.name;
        selRes.appendChild(opt);
      }
      // sæt starttid til første ledige slot fra availability
      await prefillFromAvailability();
    }

    async function prefillFromAvailability() {
      const dateISO = toISODate(inpDate.value || todayStr());
      const resId = selRes.value;
      if (!resId) return;

      const r = await fetch(`/api/availability?date=${encodeURIComponent(dateISO)}`);
      if (!r.ok) return;
      const avail = await r.json();
      const slots = avail?.resources?.[resId] || [];
      if (slots.length) {
        const first = slots[0]; // fx {label:"19:00", iso_start_local:"..."}
        inpStart.value = first.label;
        updateEnd();
      }
      await loadDayList(); // viser bookinger for denne dato/bord
    }

    // Liste for valgt dato/bord
    async function loadDayList() {
      listEl.innerHTML = '';
      const dateISO = toISODate(inpDate.value || todayStr());
      const resId = parseInt(selRes.value || '0', 10);
      const r = await fetch(`/api/bookings?date=${encodeURIComponent(dateISO)}`);
      if (!r.ok) { listEl.textContent = 'Kunne ikke hente bookinger.'; return; }
      const all = await r.json();
      const mine = all.filter(b => b.resource_id === resId);

      if (!mine.length) {
        listEl.innerHTML = '<div class="text-gray-500">Ingen bookinger endnu.</div>';
        return;
      }

      for (const b of mine) {
        const s = new Date(b.start_iso_local);
        const e = new Date(b.end_iso_local);
        const div = document.createElement('div');
        div.className = 'flex items-start justify-between border-b last:border-0 py-2';
        div.innerHTML = `
          <div>
            <div class="font-medium">${s.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} – ${e.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
            <div class="text-gray-600">${b.name}${b.phone ? ' · '+b.phone : ''}${b.email ? ' · '+b.email : ''}</div>
          </div>
          <div class="text-gray-500">#${b.id}</div>
        `;
        listEl.appendChild(div);
      }
    }

    selRes.addEventListener('change', prefillFromAvailability);
    inpDate.addEventListener('change', prefillFromAvailability);

    // Tjek & book
    btnCheck.addEventListener('click', async () => {
      statusEl.textContent = '';

      const resource_id = parseInt(selRes.value || '0', 10);
      const date = toISODate(inpDate.value || todayStr());
      const start_time = (inpStart.value || '').trim();
      const duration = parseInt(selDur.value || '60', 10);
      const name = (inpName.value || '').trim();
      const phone = (inpPhone.value || '').trim();
      const email = (inpEmail.value || '').trim();

      if (!resource_id) { alert('Vælg et bord.'); return; }
      if (!/^\d{2}:\d{2}$/.test(start_time)) { alert('Angiv starttid (HH:MM).'); return; }
      if (!name) { alert('Angiv dit navn.'); return; }
      if (!email) { alert('Angiv en email for bekræftelse.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('Email ser ikke gyldig ud.'); return; }

      // Nogle backends bruger "hour" i stedet for "start_time"+duration.
      // Din backend accepterer allerede "start_time" – vi sender duration med,
      // men hvis den ignoreres, beregner serveren selv slut.
      const payload = {
        resource_id,
        date,
        start_time,     // HH:MM
        duration,       // minutter
        name,
        phone,
        email           // VIGTIGT: til bekræftelsesmail
      };

      const res = await fetch('/api/bookings', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Booket! Du modtager en bekræftelse på e-mail.');
        await loadDayList();
      } else {
        let msg = `Kunne ikke booke (HTTP ${res.status})`;
        try { const j = await res.json(); if (j.detail) msg = j.detail; } catch {}
        statusEl.textContent = msg;
        alert(msg);
      }
    });

    // Init
    (async () => {
      // sæt en startværdi så slut (auto) kan regnes
      inpStart.value = '19:00';
      updateEnd();
      await loadResources();
    })();
  </script>
</body>
</html>
