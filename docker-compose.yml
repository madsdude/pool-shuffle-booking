version: "3.9"

services:
  db:
    image: postgres:16
    container_name: booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      TZ: Europe/Copenhagen
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [web]

  booking:
    build:
      context: .
      dockerfile: Dockerfile.txt
    container_name: booking
    restart: unless-stopped
    environment:
      # Åbningstider og autoseed
      POOL_COUNT: "3"
      SHUFFLE_COUNT: "2"
      OPEN_HOUR: "15"
      CLOSE_HOUR: "4"

      # Mail/SMTP (fra .env)
      EMAIL_FROM: "${EMAIL_FROM}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_TLS: "${SMTP_TLS}"

      # DB URL (psycopg3)
      DATABASE_URL: "postgresql+psycopg://booking:booking@db:5432/booking"
      DB_URL: "postgresql+psycopg://booking:booking@db:5432/booking"
      TZ: Europe/Copenhagen

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    # VIGTIGT: uvicorn binder til 0.0.0.0 (gør porten synlig for Caddy)
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks: [web]

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    # Start Caddy uden at vente på booking-health (ellers kan forsiden blokere)
    depends_on:
      - booking
    networks: [web]

networks:
  web:
    driver: bridge

volumes:
  pg_data:
  caddy_data:
  caddy_config:
